<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kettlebell">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4F4F4">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="manifest" href="/manifest.json">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{margin:0}body{font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Rutinas Kettlebell</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Mono skin: white + black pills, soft shadows. Layout: phone-first single column. Greeting, focus chips, A/B/C segmented, summary hero, tap-to-cycle setting tiles, exercise cards, floating start dock.
*/
:root{
  --bg:#F4F4F4; --surface:#FFFFFF; --surface2:#FFFFFF; --fg:#111111; --muted:#7B7B7B; --line:#EAEAEA;
  --accent:#111111; --onAccent:#FFFFFF; --rest:#2E6BFF;
  --chipOn:#111111; --chipOnFg:#FFFFFF; --chipOff:#FFFFFF; --chipBorder:transparent;
  --heroBg:#111111; --heroFg:#FFFFFF; --heroMuted:#A3A3A3; --tickOn:#FFFFFF; --tickOff:#3A3A3A;
  --thumb:#F2F2F2; --fig:#111111; --kb:#2E6BFF; --shadow:0 10px 30px rgba(0,0,0,.07),0 1px 3px rgba(0,0,0,.05); --dock:#111111; --dockFg:#FFFFFF;
  --font:"Plus Jakarta Sans","Helvetica Neue",Arial,sans-serif; --numW:600; --hW:600; --r:22px;
  --playerBg:#FFFFFF; color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;transition:background .3s}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;font-weight:var(--numW);letter-spacing:-.02em}

.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 120px;display:flex;flex-direction:column;gap:24px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
.brand svg{width:22px;height:22px}
.hello{font-size:34px;line-height:1.05;font-weight:var(--hW);margin:6px 0 0;letter-spacing:-.02em;text-wrap:balance}
.hello span{color:var(--muted)}

/* focus cards (primary choice) */
.blk{display:flex;flex-direction:column;gap:10px}
.lbl{margin:0;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.focus{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fcard{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:14px;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);text-align:left;min-width:0}
.fcard .ic{width:42px;height:42px;border-radius:50%;background:var(--thumb);display:grid;place-items:center}
.fcard .ic svg{width:26px;height:26px}
.fcard b{font-size:16px;font-weight:600;line-height:1.15}
.fcard span{font-size:12.5px;color:var(--muted);line-height:1.3}
.fcard div{display:flex;flex-direction:column;gap:2px}
.fcard[aria-pressed="true"]{background:var(--chipOn);color:var(--chipOnFg)}
.fcard[aria-pressed="true"] .ic{background:#fff;color:#111}
.fcard[aria-pressed="true"] span{color:#A3A3A3}
/* routine segmented (secondary choice) */
.seg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;padding:4px;border-radius:16px;background:#E8E8E8}
.seg3 button{border-radius:12px;padding:9px 6px;font-size:13px;font-weight:500;line-height:1.2;color:#6B6B6B;min-width:0}
.seg3 button b{display:block;font-weight:700;font-size:11px;letter-spacing:.06em;margin-bottom:1px}
.seg3 button[aria-pressed="true"]{background:#fff;color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
/* persona chooser */
.pers{display:flex;align-items:center;gap:4px;align-self:center;padding:4px;border-radius:999px;background:var(--thumb);margin-top:-2px}
.pers span{font-size:12px;color:var(--muted);padding:0 8px 0 10px}
.pers button{padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--muted)}
.pers button[aria-pressed="true"]{background:var(--fg);color:#fff}
/* hero */
.hero{position:relative;border-radius:var(--r);background:var(--heroBg);color:var(--heroFg);padding:20px;display:flex;flex-direction:column;gap:14px;overflow:hidden;--fig:var(--heroFg)}
.hero .eyebrow{font-size:13px;color:var(--heroMuted);margin:0}
.hero h2{font-size:28px;font-weight:var(--hW);margin:-8px 0 0;line-height:1.05;max-width:62%;letter-spacing:-.01em}
.viewer{position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.viewer canvas{display:block;width:100%;height:100%;cursor:grab}
.vtog{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);display:flex;gap:2px;padding:3px;border-radius:999px;background:rgba(255,255,255,.92);box-shadow:0 4px 14px rgba(0,0,0,.1)}
.vtog button{padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--muted)}
.vtog button[aria-pressed="true"]{background:var(--fg);color:#fff}
.sprite{position:relative;width:100%;height:100%;overflow:hidden;background:#cfcfcf}
.sprite img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s ease}
.sprite img.on{opacity:1}
.sprite.flip img{transform:scaleX(-1)}
.ring .view .sprite{border-radius:50%}
.card .thumb.real{object-fit:cover}
@media (prefers-reduced-motion:reduce){.sprite img{transition:none}}
.badge{display:inline-flex;align-self:flex-start;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--thumb);color:var(--fg)}
.side{display:inline-block;margin-left:6px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--fg);color:#fff;vertical-align:middle}
.dragh{font-size:12px;color:var(--muted);text-align:center;margin-top:-6px}
.stats{display:flex;gap:22px;margin-top:6px}
.stats div{display:flex;flex-direction:column}
.stats b{font-size:40px;line-height:1}
.stats i{font-style:normal;font-size:12.5px;color:var(--heroMuted)}
.hstart{display:none;justify-content:space-between;align-items:center;margin-top:6px;background:#fff;color:#111;border-radius:999px;padding:7px 7px 7px 22px;font-weight:600;font-size:17px}
.hstart .pl{width:44px;height:44px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center}
.hstart .pl svg{width:18px;height:18px;margin-left:2px}
.hstart:disabled{opacity:.4}
.ticks{display:flex;gap:3px;height:18px}
.ticks i{flex:1;border-radius:3px;background:var(--tickOn)}
.ticks i.r{background:var(--tickOff)}

.sechead{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.sechead h3{font-size:20px;font-weight:var(--hW);margin:0}
.sechead span{font-size:13px;color:var(--muted)}

/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);padding:14px 14px 12px;text-align:left;display:flex;flex-direction:column;gap:18px;min-width:0}
.tile .lb{font-size:13px;color:var(--muted)}
.tile .bt{display:flex;justify-content:space-between;align-items:flex-end;gap:6px}
.tile .v{font-size:34px;line-height:.9}
.tile .v small{font-size:14px;color:var(--muted);margin-left:2px;letter-spacing:0}
.pips{display:flex;gap:4px;align-items:center}
.pips i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.pips i.on{width:9px;height:9px;background:var(--fg)}
.tile.wide{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center;gap:10px}
.tile.wide div{display:flex;flex-direction:column;gap:2px}
.tile.wide b{font-weight:500;font-size:15px}
.switch{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
[aria-pressed="true"] > .switch,.switch[aria-pressed="true"]{background:var(--accent)}
[aria-pressed="true"] > .switch::after,.switch[aria-pressed="true"]::after{left:21px;background:var(--onAccent)}

/* exercise cards */
.ex{display:flex;flex-direction:column;gap:8px}
.card{border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);padding:8px 12px 8px 8px;display:flex;flex-direction:column}
.card .main{display:grid;grid-template-columns:64px minmax(0,1fr) auto auto;align-items:center;gap:12px}
.card .thumb{width:64px;height:64px;object-fit:contain;border-radius:calc(var(--r) - 8px);background:var(--thumb);display:block}
.card .info{text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.card .info b{font-weight:600;font-size:15.5px}
.card .info span{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tipb{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:var(--surface2)}
.tipb svg{width:18px;height:18px}
.tipb[aria-expanded="true"]{background:var(--accent);color:var(--onAccent)}
.tipbox{margin:10px 4px 6px;padding:12px 14px;border-radius:calc(var(--r) - 8px);background:var(--surface2);font-size:14px;line-height:1.45;border:1px solid var(--line)}
.tipbox b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:3px;font-weight:600}
.card.off .thumb,.card.off .info{opacity:.35}
.fig{--cloth:#1B1B1D;--clothFar:#77777B;--skin:#D8B596;--skinFar:#B99A7E;--hairC:#2B211B;--shoeC:#1B1B1D;--shoeFar:#77777B;overflow:visible}
.fig line{stroke-linecap:round;fill:none}
.fig .w24{stroke-width:24}.fig .w22{stroke-width:22}.fig .w15{stroke-width:15}.fig .w11{stroke-width:11}.fig .w10{stroke-width:10}.fig .w9{stroke-width:9}.fig .w8{stroke-width:8}
.fig .cl{stroke:var(--cloth)}.fig .cl.far{stroke:var(--clothFar)}
.fig .sk{stroke:var(--skin);fill:var(--skin)}.fig .sk.far{stroke:var(--skinFar);fill:var(--skinFar)}
.fig circle.sk{stroke:none}
.fig .hair{fill:var(--hairC)}
.fig .shoe{fill:var(--shoeC);stroke:var(--shoeC);stroke-width:2;stroke-linejoin:round}.fig .shoe.far{fill:var(--shoeFar);stroke:var(--shoeFar)}
.fig .shd{fill:#000;opacity:.07}
.fig .kb{fill:var(--kb)}
.fig .kbh{fill:none;stroke:var(--kb);stroke-width:4;stroke-linecap:round}
.fig .kbs{fill:#fff;opacity:.35}
.hero .fig{--cloth:#F2F2F2;--clothFar:#8C8C8C;--shoeC:#F2F2F2;--shoeFar:#8C8C8C;--hairC:#C9C9C9}
.hero .fig .shd{fill:#fff}
.hero .fig .kb{fill:var(--tickOn)}.hero .fig .kbh{stroke:var(--tickOn)}.hero .fig .kbs{fill:#111}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(transparent,var(--bg) 45%);pointer-events:none}
.dock button{pointer-events:auto;display:flex;justify-content:space-between;align-items:center;width:100%;max-width:520px;margin:0 auto;background:var(--dock);color:var(--dockFg);border-radius:999px;padding:8px 8px 8px 22px;font-weight:600;font-size:17px;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.dock .pl{width:46px;height:46px;border-radius:50%;background:var(--dockFg);color:var(--dock);display:grid;place-items:center}
.dock .pl svg{width:18px;height:18px;margin-left:2px}
.dock small{font-weight:400;opacity:.7;font-size:14px;margin-left:8px}
.dock button:disabled{opacity:.4}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:28px 28px 0 0;padding:20px max(20px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;max-height:92%;overflow:auto}
.sheet .big{width:100%;max-width:340px;aspect-ratio:1;align-self:center;background:var(--thumb);border-radius:var(--r);overflow:hidden}
.sheet h2{font-size:28px;font-weight:var(--hW);margin:0;line-height:1.05}
.sheet .mus{color:var(--muted);font-size:14px;margin-top:-4px}
.cues{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.srow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{border-radius:999px;padding:11px 16px;font-weight:500;font-size:14px;background:var(--surface2);border:1px solid var(--line);color:var(--fg);text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.pill svg{width:16px;height:16px}
.pill.dark{background:var(--accent);color:var(--onAccent);border-color:var(--accent)}

/* player */
.player{position:fixed;inset:0;z-index:30;background:var(--playerBg);display:flex;flex-direction:column;--pc:var(--accent)}
.player[data-phase="rest"],.player[data-phase="roundrest"]{--pc:var(--rest)}
.player[data-phase="prep"],.player[data-phase="warm"]{--pc:var(--muted)}
.player[data-phase="show"],.player[data-phase="switch"]{--pc:var(--rest)}
.pin{flex:1;max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));min-height:0}
.ptop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ptop .mid{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.rb{width:42px;height:42px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;flex:none}
.rb svg{width:18px;height:18px}
.rb.warn{width:auto;padding:0 14px;border-radius:999px;background:var(--fg);color:var(--bg);font-size:13px;font-weight:600}
.pticks{display:flex;gap:3px}
.pticks i{flex:1;height:4px;border-radius:2px;background:color-mix(in srgb,var(--fg) 14%,transparent)}
.pticks i.done{background:var(--fg)}
.pticks i.cur{background:var(--pc)}
.phrow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-top:6px}
.phase{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:var(--pc);color:var(--onAccent);margin-bottom:8px}
.player[data-phase="show"] .phase,.player[data-phase="switch"] .phase,.player[data-phase="rest"] .phase,.player[data-phase="roundrest"] .phase,.player[data-phase="prep"] .phase,.player[data-phase="warm"] .phase{color:#fff}
.pname{font-size:30px;font-weight:var(--hW);margin:0;line-height:1.05;letter-spacing:-.01em;text-wrap:balance}
.ptip{padding:12px 14px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);font-size:14px;border:1px solid var(--line)}
.ptip b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.stage{flex:1;min-height:180px;display:flex;align-items:center;justify-content:center}
.ring{position:relative;height:100%;max-height:300px;aspect-ratio:1;max-width:100%}
.ring > svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:color-mix(in srgb,var(--fg) 10%,transparent);stroke-width:2.5}
.ring .prg{fill:none;stroke:var(--pc);stroke-width:2.5;stroke-linecap:round;transition:stroke .3s}
.ring .view{position:absolute;inset:5%;border-radius:50%;transition:opacity .3s,transform .3s}
.nextbadge{position:absolute;left:50%;bottom:2%;transform:translate(-50%,40%);background:var(--rest);color:#fff;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:6px 14px;border-radius:999px;box-shadow:0 4px 14px rgba(46,107,255,.35);opacity:0;transition:opacity .25s}
.ring.preview .nextbadge{opacity:1}
.ring.preview .view{transform:scale(.94);opacity:.92}
.ring.preview .view::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 3px var(--rest);pointer-events:none}
.upnext{display:block;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--rest);margin-bottom:4px}
.ring .fig{position:absolute;inset:12%;width:76%;height:76%;transform:none}
.ring .view .vtog{bottom:-4px}
.clock{font-size:clamp(76px,24vw,112px);line-height:.9;text-align:center}
.next{font-size:14px;color:var(--muted);text-align:center;min-height:21px}
.next b{color:var(--fg);font-weight:600}
.ctrls{display:flex;justify-content:center;align-items:center;gap:26px;margin-top:6px}
.cbtn{width:56px;height:56px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;border:1px solid var(--line)}
.cbtn.main{width:80px;height:80px;background:var(--pc);color:var(--onAccent);border-color:var(--pc)}
.player:not([data-phase="work"]) .cbtn.main{color:#fff}
.cbtn svg{width:22px;height:22px}
.cbtn.main svg{width:30px;height:30px}
.done{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;text-align:center;align-items:center}
.done h2{font-size:44px;font-weight:var(--hW);margin:0;line-height:1;letter-spacing:-.02em}
.done p{margin:0;color:var(--muted)}
.done .dock-like{background:var(--dock);color:var(--dockFg);border-radius:999px;padding:16px 40px;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.col{display:flex;flex-direction:column;gap:24px;min-width:0}
.colB .sechead{margin-top:6px}
@media (min-width:900px){.colB .sechead:first-child{margin-top:0}.colB{padding-top:4px}}
/* ---------- wide screens: landscape layout ---------- */
@media (min-width:900px){
  .app{max-width:1280px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px 40px;align-items:start;padding-block:28px 140px}
  .top{grid-column:1/-1}
  .colA{grid-column:1;grid-row:2}.colB{grid-column:1;grid-row:3}.colC{grid-column:2;grid-row:2/span 2}
  .hello{font-size:32px}
  .dock{padding-top:56px;background:linear-gradient(rgba(244,244,244,0),var(--bg) 55%)}
  .colC .sechead{margin-top:0}
  .dock button{max-width:440px}
  .scrim{align-items:center}
  .sheet{max-width:900px;border-radius:28px;display:grid;grid-template-columns:360px minmax(0,1fr);column-gap:32px;row-gap:12px;align-content:start;max-height:88vh;padding:28px}
  .sheet .big{grid-column:1;grid-row:1/span 8;max-width:none;align-self:start}
  .sheet>*:not(.big){grid-column:2}
  .sheet .badge{justify-self:start}
  .pin{max-width:1280px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);column-gap:64px;row-gap:14px;
    grid-template-rows:auto auto 1fr auto auto auto auto auto 1fr;
    grid-template-areas:"top top" "ticks ticks" "stage ." "stage phrow" "stage tip" "stage clock" "stage next" "stage ctrls" "stage .";padding-inline:max(32px,env(safe-area-inset-left,0px))}
  .ptop{grid-area:top}.pticks{grid-area:ticks}.phrow{grid-area:phrow}.ptip{grid-area:tip}.stage{grid-area:stage;min-height:0}
  .clock{grid-area:clock;text-align:left;font-size:clamp(120px,11vw,180px)}
  .next{grid-area:next;text-align:left;font-size:16px}
  .ctrls{grid-area:ctrls;justify-content:flex-start;margin-top:16px}
  .pname{font-size:44px}
  .ring{max-height:min(74vh,640px)}
  .done{grid-column:1/-1;grid-row:1/-1}
}
@media (min-width:1240px){
  .app{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.05fr)}
  .colA{grid-column:1;grid-row:2}.colB{grid-column:2;grid-row:2}.colC{grid-column:3;grid-row:2}
}
</style>

<div class="app" id="home">
  <div class="top">

<script>
/* ---------- figure engine (mannequin) ---------- */
const T=46,UA=27,FA=25,TH=37,SH=36;
const R=d=>d*Math.PI/180;
const v=(a,L)=>[L*Math.sin(R(a)),L*Math.cos(R(a))];
const DEF={fx:100,fy:185,th:0,sh:0,t:0,ua:0,fa:0,kx:0,ky:14,kb2:0,adR:0};
function norm(p){const q={...DEF,...p};if(q.th2==null)q.th2=q.th;if(q.sh2==null)q.sh2=q.sh;if(q.ua2==null)q.ua2=q.ua;if(q.fa2==null)q.fa2=q.fa;return q}
function add(a,b){return[a[0]+b[0],a[1]+b[1]]}
function solve(q){
  let hip;
  if(q.hx!=null){hip=[q.hx,q.hy]}
  else{const s=v(q.sh,SH),t=v(q.th,TH);hip=[q.fx-s[0]-t[0],q.fy-s[1]-t[1]]}
  const k1=add(hip,v(q.th,TH)),f1=add(k1,v(q.sh,SH));
  const k2=add(hip,v(q.th2,TH)),f2=add(k2,v(q.sh2,SH));
  const d=[Math.sin(R(q.t)),-Math.cos(R(q.t))],n=[-d[1],d[0]];
  const sh=[hip[0]+d[0]*T,hip[1]+d[1]*T];
  const hd=[hip[0]+d[0]*(T+19)+n[0]*2,hip[1]+d[1]*(T+19)+n[1]*2];
  const el=add(sh,v(q.ua,UA)),ha=add(el,v(q.fa,FA));
  const el2=add(sh,v(q.ua2,UA)),ha2=add(el2,v(q.fa2,FA));
  return {hip,k1,f1,k2,f2,sh,hd,d,n,el,ha,el2,ha2,kb:[ha[0]+q.kx,ha[1]+q.ky],kb2:q.kb2>.5?[ha2[0]+q.kx,ha2[1]+q.ky]:null};
}
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
function lerpPose(a,b,u){const o={};for(const k in a){o[k]=a[k]+(b[k]-a[k])*u}return o}
const NS="http://www.w3.org/2000/svg";
const PARTS=[["shadow","ellipse","shd"],["thigh2","line","cl far w15"],["shin2","line","cl far w11"],["foot2","path","shoe far"],
  ["up2","line","sk far w10"],["fo2","line","sk far w8"],["hand2","circle","sk far"],["kb2","g","kbg"],
  ["torso","line","cl w24"],["pelvis","line","cl w22"],["thigh1","line","cl w15"],["shin1","line","cl w11"],["foot1","path","shoe"],
  ["neck","line","sk w9"],["hair","circle","hair"],["face","circle","sk"],["up1","line","sk w10"],["fo1","line","sk w8"],["hand1","circle","sk"],["kb1","g","kbg"]];
function makeFig(exId){
  const s=document.createElementNS(NS,"svg");
  s.setAttribute("viewBox","-4 -14 208 206");s.setAttribute("class","fig");s.setAttribute("aria-hidden","true");
  s._p={};
  for(const [k,tag,cls] of PARTS){const e=document.createElementNS(NS,tag);e.setAttribute("class",cls);
    if(tag==="g")e.innerHTML='<path class="kbh"/><circle class="kb" r="11"/><ellipse class="kbs" rx="3" ry="2"/>';
    s.appendChild(e);s._p[k]=e}
  s._ex=exId;s._t0=Math.random()*3;drawFig(s,0);return s;
}
const f1=x=>x.toFixed(1);
function ln(e,a,b){e.setAttribute("x1",f1(a[0]));e.setAttribute("y1",f1(a[1]));e.setAttribute("x2",f1(b[0]));e.setAttribute("y2",f1(b[1]))}
function circ(e,c,r){e.setAttribute("cx",f1(c[0]));e.setAttribute("cy",f1(c[1]));if(r)e.setAttribute("r",r)}
function shoe(e,ank,knee){
  // sole points forward (+x) from the ankle, heel slightly behind
  const up=[knee[0]-ank[0],knee[1]-ank[1]],L=Math.hypot(...up)||1,u=[up[0]/L,up[1]/L];
  const fw=[-u[1],u[0]];const F=fw[0]>=0?fw:[-fw[0],-fw[1]];
  const p=(a,b)=>[ank[0]+F[0]*a+u[0]*b,ank[1]+F[1]*a+u[1]*b];
  const pts=[p(-5,4),p(-5,-4),p(14,-4),p(15,-1),p(12,2),p(2,4)];
  e.setAttribute("d","M"+pts.map(q=>f1(q[0])+" "+f1(q[1])).join("L")+"Z");
}
function bell(g,c){
  if(!c){g.style.display="none";return}g.style.display="";
  const [cx,cy]=c,[h,b,sh]=g.children;
  h.setAttribute("d",`M${f1(cx-7)} ${f1(cy-6)}V${f1(cy-13)}Q${f1(cx-7)} ${f1(cy-18)} ${f1(cx-2)} ${f1(cy-18)}H${f1(cx+2)}Q${f1(cx+7)} ${f1(cy-18)} ${f1(cx+7)} ${f1(cy-13)}V${f1(cy-6)}`);
  circ(b,[cx,cy]);sh.setAttribute("cx",f1(cx-4));sh.setAttribute("cy",f1(cy-4));
}
function drawFig(s,time){
  const ex=EX[s._ex];if(!ex)return;
  const F=ex.frames,n=F.length,loop=ex.loop;
  const ph=((time+s._t0)%loop)/loop*n,i=Math.floor(ph),u=ease(ph-i);
  const q=lerpPose(F[i%n],F[(i+1)%n],u),j=solve(q),P=s._p;
  const gx=(Math.min(j.f1[0],j.f2[0],j.hip[0])+Math.max(j.f1[0],j.f2[0],j.hip[0]))/2;
  P.shadow.setAttribute("cx",f1(gx+4));P.shadow.setAttribute("cy","187");P.shadow.setAttribute("rx",f1(Math.max(26,Math.abs(j.f1[0]-j.hip[0])+30)));P.shadow.setAttribute("ry","4");
  ln(P.thigh2,j.hip,j.k2);ln(P.shin2,j.k2,j.f2);shoe(P.foot2,j.f2,j.k2);
  ln(P.up2,j.sh,j.el2);ln(P.fo2,j.el2,j.ha2);circ(P.hand2,j.ha2,4.6);bell(P.kb2,j.kb2);
  const sh2=[j.sh[0]-j.d[0]*2,j.sh[1]-j.d[1]*2];
  ln(P.torso,[j.hip[0]+j.d[0]*14+j.n[0]*1.5,j.hip[1]+j.d[1]*14+j.n[1]*1.5],sh2);
  ln(P.pelvis,j.hip,[j.hip[0]+j.d[0]*12,j.hip[1]+j.d[1]*12]);
  ln(P.thigh1,j.hip,j.k1);ln(P.shin1,j.k1,j.f1);shoe(P.foot1,j.f1,j.k1);
  ln(P.neck,j.sh,j.hd);
  circ(P.hair,[j.hd[0]-j.n[0]*2+j.d[0]*1.5,j.hd[1]-j.n[1]*2+j.d[1]*1.5],10.5);circ(P.face,[j.hd[0]+j.n[0]*.8,j.hd[1]+j.n[1]*.8],9.6);
  ln(P.up1,j.sh,j.el);ln(P.fo1,j.el,j.ha);circ(P.hand1,j.ha,5);bell(P.kb1,j.kb);
}

/* ---------- 3D person (three.js) ---------- */
const S3=0.0118,FOOTY=0.08,FRENTE=0.12,PERFIL=Math.PI/2;
const HAS3D=(()=>{try{if(!window.THREE||!THREE.CapsuleGeometry)return false;const c=document.createElement("canvas");return !!(c.getContext("webgl2")||c.getContext("webgl"))}catch(e){return false}})();
let G3=null;
const PERSONAS={atleta:"Atleta",clay:"Clay",maniqui:"Maniquí"};
function buildRig(style){
  const V2=THREE.Vector2;
  const mat=(c,r=.8)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:0});
  const P=style==="clay"?{skin:mat(0xece6df,.95),top:mat(0xece6df,.95),bot:mat(0xece6df,.95),shoe:mat(0xe2dbd3,.95),hair:mat(0xd6cdc3,.95),joint:null}
    :style==="maniqui"?{skin:mat(0xd9b282,.55),top:mat(0xd9b282,.55),bot:mat(0xd9b282,.55),shoe:mat(0xd9b282,.55),hair:null,joint:mat(0xa87a4c,.5)}
    :{skin:mat(0xc99a78,.6),top:mat(0x1e1e22,.85),bot:mat(0x33333a,.9),shoe:mat(0xf2f2f2,.55),hair:mat(0x2a1f19,.95),joint:null};
  const sole=mat(style==="atleta"?0xbdbdbd:0xd0c7bd,.8);
  const sph=(r,m,n=22)=>new THREE.Mesh(new THREE.SphereGeometry(r,n,Math.round(n*.75)),m);
  // tapered limb along -Y from the joint: r1 at the joint, r2 at the far end, soft muscle bulge
  const limb=(r1,r2,len,m,bul=0,peak=.6)=>{const pts=[],N=6;
    for(let i=0;i<=N;i++){const a=-Math.PI/2+i/N*Math.PI/2;pts.push(new V2(Math.max(1e-4,Math.cos(a)*r2),-len+Math.sin(a)*r2))}
    for(let i=1;i<12;i++){const t=i/12;pts.push(new V2(r2+(r1-r2)*t+bul*Math.sin(Math.PI*Math.pow(t,Math.log(.5)/Math.log(peak))),-len+len*t))}
    for(let i=0;i<=N;i++){const a=i/N*Math.PI/2;pts.push(new V2(Math.max(1e-4,Math.cos(a)*r1),Math.sin(a)*r1))}
    return new THREE.Mesh(new THREE.LatheGeometry(pts,22),m)};
  const Lsp=46*S3,Lua=.29,Lfa=.255,Lth=37*S3,Lsh=36*S3;
  const root=new THREE.Group(),body=new THREE.Group();root.add(body);
  const hips=new THREE.Group();body.add(hips);
  const pel=sph(.125,P.bot);pel.scale.set(1.25,.85,.9);pel.position.y=.02;hips.add(pel);
  for(const s of[-1,1]){const gl=sph(.075,P.bot);gl.position.set(s*.06,-.01,-.055);hips.add(gl)}
  const spine=new THREE.Group();hips.add(spine);
  // torso profile: hips -> waist -> chest -> shoulders
  const prof=[[0,-.02],[.118,0],[.125,.06],[.112,.15],[.108,.2],[.122,.29],[.14,.37],[.145,.43],[.13,.49],[.09,.53],[.04,.548],[0,.552]].map(([r,y])=>new V2(Math.max(1e-4,r),y));
  const torso=new THREE.Mesh(new THREE.LatheGeometry(prof,28),P.top);torso.scale.set(1.18,1,.74);torso.position.y=.02;spine.add(torso);
  if(P.joint){const w=sph(.1,P.joint);w.scale.set(1.15,.5,.8);w.position.y=.19;spine.add(w)}
  const neck=new THREE.Mesh(new THREE.CylinderGeometry(.043,.05,.12,16),P.skin);neck.position.y=Lsp+.05;spine.add(neck);
  const head=new THREE.Group();head.position.y=Lsp+.18;spine.add(head);
  const sk=sph(.098,P.skin,28);sk.scale.set(.84,1.1,.96);head.add(sk);
  const jaw=sph(.07,P.skin,20);jaw.scale.set(.95,.8,1);jaw.position.set(0,-.05,.022);head.add(jaw);
  if(P.hair){const hr=sph(.102,P.hair,28);hr.scale.set(.88,.95,.96);hr.position.set(0,.03,-.022);head.add(hr)}
  if(style!=="maniqui"){const nose=sph(.016,P.skin,10);nose.scale.set(1,1.3,1);nose.position.set(0,-.01,.092);head.add(nose);
    for(const s of[-1,1]){const e=sph(.02,P.skin,10);e.scale.set(.55,1,.8);e.position.set(s*.083,-.005,0);head.add(e)}}
  const arms={},legs={};
  for(const s of[-1,1]){ // -1 = right side of the person
    const sh=new THREE.Group();sh.position.set(s*.175,Lsp-.035,0);spine.add(sh);
    const delt=sph(.06,P.joint||P.top);delt.scale.set(1,1.05,1.05);sh.add(delt);
    sh.add(limb(.048,.037,Lua,P.skin,.008,.65));
    if(style==="atleta")sh.add(limb(.055,.05,.1,P.top));
    const el=new THREE.Group();el.position.y=-Lua;sh.add(el);
    if(P.joint)el.add(sph(.036,P.joint));
    el.add(limb(.038,.026,Lfa,P.skin,.007,.7));
    const hand=new THREE.Group();hand.position.y=-Lfa;el.add(hand);
    if(P.joint)hand.add(sph(.026,P.joint));
    const palm=sph(.042,P.skin,16);palm.scale.set(.6,1.15,.95);palm.position.y=-.035;hand.add(palm);
    const th=sph(.016,P.skin,10);th.scale.set(1,1.6,1);th.position.set(-s*.012,-.025,.03);hand.add(th);
    arms[s]={sh,el,hand};
    const hp=new THREE.Group();hp.position.set(s*.092,0,0);hips.add(hp);
    if(P.joint)hp.add(sph(.062,P.joint));
    hp.add(limb(.078,.05,Lth,P.bot,.012,.7));
    const kn=new THREE.Group();kn.position.y=-Lth;hp.add(kn);
    if(P.joint)kn.add(sph(.05,P.joint));
    kn.add(limb(.05,.032,Lsh,P.bot,.014,.75));
    const an=new THREE.Group();an.position.y=-Lsh;kn.add(an);
    if(P.joint)an.add(sph(.032,P.joint));
    const foot=sph(.05,P.shoe,18);foot.scale.set(.95,.7,2.4);foot.position.set(0,-.045,.055);an.add(foot);
    if(style==="atleta"){const so=new THREE.Mesh(new THREE.BoxGeometry(.094,.02,.245),sole);so.position.set(0,-.072,.055);an.add(so)}
    legs[s]={hp,kn,an};
  }
  return {root,body,hips,spine,arms,legs};
}
function makeBell(){
  const g=new THREE.Group(),m=new THREE.MeshStandardMaterial({color:0x2e6bff,roughness:.4,metalness:.1});
  const b=new THREE.Mesh(new THREE.SphereGeometry(.1,26,20),m);b.scale.set(1,.93,1);g.add(b);
  const h=new THREE.Mesh(new THREE.TorusGeometry(.062,.014,10,28,Math.PI),m);h.position.y=.07;g.add(h);
  for(const s of[-1,1]){const p=new THREE.Mesh(new THREE.CylinderGeometry(.014,.017,.05,8),m);p.position.set(s*.062,.06,0);g.add(p)}
  return g;
}
function init3D(){
  const CM=THREE.ColorManagement;if(CM){if("legacyMode" in CM)CM.legacyMode=false;else CM.enabled=true}
  const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.outputEncoding=THREE.sRGBEncoding;renderer.setClearColor(0x000000,0);renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
  const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(30,1,.05,40);
  scene.add(new THREE.HemisphereLight(0xffffff,0x8a8a8a,.95));
  const key=new THREE.DirectionalLight(0xffffff,1.35);key.position.set(2.5,4,3.5);scene.add(key);
  const rim=new THREE.DirectionalLight(0xffffff,.5);rim.position.set(-3,2.5,-3);scene.add(rim);
  const turn=new THREE.Group();scene.add(turn);
  const rig=buildRig(S.persona||"atleta");turn.add(rig.root);
  const bell1=makeBell(),bell2=makeBell();rig.body.add(bell1,bell2);
  const c=document.createElement("canvas");c.width=c.height=128;const x=c.getContext("2d");const gr=x.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,"rgba(0,0,0,.28)");gr.addColorStop(1,"rgba(0,0,0,0)");x.fillStyle=gr;x.fillRect(0,0,128,128);
  const shadow=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthWrite:false}));
  shadow.rotation.x=-Math.PI/2;shadow.position.y=.002;turn.add(shadow);
  G3={renderer,scene,camera,turn,rig,bell1,bell2,shadow,v:new THREE.Vector3(),v2:new THREE.Vector3(),w:0,h:0};
  const cv=renderer.domElement;cv.style.touchAction="pan-y";
  let drag=null;
  cv.addEventListener("pointerdown",e=>{if(!VW)return;drag={x:e.clientX,y0:VW.yaw};try{cv.setPointerCapture(e.pointerId)}catch(_){}});
  cv.addEventListener("pointermove",e=>{if(!drag||!VW)return;VW.yaw=VW.target=drag.y0+(e.clientX-drag.x)*.012;markTog()});
  const end=()=>{drag=null};cv.addEventListener("pointerup",end);cv.addEventListener("pointercancel",end);
}
function setLeg(L,th,sh,s,st){L.hp.rotation.set(-R(th),0,s*st);L.kn.rotation.x=R(th-sh);L.an.rotation.set(R(sh),0,-s*st*.6)}
function setArm(A,ua,fa,t,s,ad){A.sh.rotation.set(-R(ua)-R(t),0,-s*ad);A.el.rotation.x=R(ua-fa)}
function poseAt(ex,time){const F=ex.frames,n=F.length;const ph=(((time%ex.loop)+ex.loop)%ex.loop)/ex.loop*n,i=Math.floor(ph);return lerpPose(F[i%n],F[(i+1)%n],ease(ph-i))}
function apply3(ex,q){
  const j=solve(q),rig=G3.rig;
  rig.hips.position.set(0,(185-j.hip[1])*S3+FOOTY,(j.hip[0]-100)*S3);
  rig.spine.rotation.x=R(q.t);
  const st=R(ex.st||4);
  setLeg(rig.legs[-1],q.th,q.sh,-1,st);setLeg(rig.legs[1],q.th2,q.sh2,1,st);
  const D=(ua,fa)=>Math.hypot(...add(v(ua,UA),v(fa,FA)))*S3;
  const inA=(ua,fa)=>Math.asin(Math.min(.95,.16/Math.max(.17,D(ua,fa))));
  if(ex.two){setArm(rig.arms[-1],q.ua,q.fa,q.t,-1,inA(q.ua,q.fa));setArm(rig.arms[1],q.ua2,q.fa2,q.t,1,inA(q.ua2,q.fa2))}
  else{setArm(rig.arms[-1],q.ua,q.fa,q.t,-1,R(q.adR||0));setArm(rig.arms[1],q.ua2,q.fa2,q.t,1,ex.renegade?0:-R(7))}
  rig.root.updateMatrixWorld(true);
  const hp=(s,out)=>rig.body.worldToLocal(rig.arms[s].hand.getWorldPosition(out));
  const a=hp(-1,G3.v),b=hp(1,G3.v2);
  const p=ex.two?a.clone().add(b).multiplyScalar(.5):a.clone();
  G3.bell1.position.set(p.x,p.y-q.ky*S3,p.z+q.kx*S3);
  G3.bell2.visible=q.kb2>.5;if(G3.bell2.visible)G3.bell2.position.set(b.x,b.y-q.ky*S3,b.z+q.kx*S3);
}
function frame3(ex){
  if(ex._c)return ex._c;
  const rig=G3.rig;rig.root.position.set(0,0,0);rig.root.scale.x=1;G3.turn.rotation.y=0;
  let y0=9,y1=-9,z0=9,z1=-9;
  for(let k=0;k<12;k++){apply3(ex,poseAt(ex,ex.loop*k/12));
    const pts=[rig.spine.children.find(c=>c.isGroup),rig.arms[-1].hand,rig.arms[1].hand,rig.legs[-1].an,rig.legs[1].an,rig.hips,G3.bell1];
    for(const o of pts){const w=rig.body.worldToLocal(o.getWorldPosition(G3.v));y0=Math.min(y0,w.y);y1=Math.max(y1,w.y);z0=Math.min(z0,w.z);z1=Math.max(z1,w.z)}}
  y0=Math.min(0,y0-.12);y1+=.16;z0-=.18;z1+=.18;
  const cz=(z0+z1)/2,cy=(y0+y1)/2,r=Math.max(Math.hypot((y1-y0)/2,.4),Math.hypot((z1-z0)/2,(y1-y0)/2)*.92);
  return ex._c={cz,cy,r,span:(z1-z0)};
}
function render3(ex,q,yaw,side,w,h){
  const c=frame3(ex),G=G3;
  if(G.w!==w||G.h!==h){G.renderer.setSize(w,h,false);G.w=w;G.h=h;G.camera.aspect=w/h;G.camera.updateProjectionMatrix()}
  G.rig.root.scale.x=side==="izq"?-1:1;G.rig.root.position.set(0,0,-c.cz*(side==="izq"?1:1));
  apply3(ex,q);
  G.shadow.scale.set(.75,Math.max(.6,c.span*.9),1);
  G.turn.rotation.y=yaw;
  const d=c.r/Math.sin(R(15))*1.02,el=R(9);
  G.camera.position.set(0,c.cy+d*Math.sin(el),d*Math.cos(el));G.camera.lookAt(0,c.cy,0);

}

    sw.onclick=()=>{const o=new Set(S.off[okey()]||[]);o.has(id)?o.delete(id):o.add(id);S.off[okey()]=[...o];save();renderList();renderHero();renderDur()};
    m.appendChild(sw);c.appendChild(m);
    const tip=document.createElement("div");tip.className="tipbox";tip.hidden=true;tip.innerHTML=`<b>Tip técnico</b>${x.tip}`;c.appendChild(tip);
    tb.onclick=()=>{tip.hidden=!tip.hidden;tb.setAttribute("aria-expanded",!tip.hidden)};
    el.appendChild(c);
  });
  $("cnt").textContent=`${active().length} de ${RT().ex.length} activos`;
}
function renderDur(){const t=totalSecs();$("dur").textContent=t?`${Math.round(t/60)} min`:"elegí ejercicios";$("go").disabled=!t}
function renderPers(){const el=$("homePers");if(!HAS3D){el.hidden=true;return}
  el.innerHTML=`<span>Persona</span>`+Object.entries(PERSONAS).map(([k,n])=>`<button data-p="${k}" aria-pressed="${(S.persona||"atleta")===k}">${n}</button>`).join("");
  el.querySelectorAll("button").forEach(b=>b.onclick=()=>setPersona(b.dataset.p))}
function renderAll(){renderPers();renderFocus();renderRoutines();renderHero();renderTiles();renderList();renderDur()}

/* ---------- sheet ---------- */
function openSheet(id){
  const x=EX[id],sh=$("sheet");untrack(sh);
  sh.innerHTML=`<div class="big viewer" id="sView"></div>${HAS3D&&!SPRITES[id]?`<div class="pers" role="group" aria-label="Persona"><span>Persona</span>${Object.entries(PERSONAS).map(([k,n])=>`<button data-p="${k}" aria-pressed="${(S.persona||"atleta")===k}">${n}</button>`).join("")}</div><p class="dragh">Arrastrá con el dedo para girar</p>`:''}
  <h2>${x.name}</h2><span class="badge">${x.hold}</span><div class="mus">${x.mus}</div><ol class="cues">${x.cues.map(c=>`<li>${c}</li>`).join("")}</ol>
  <div class="tipbox" id="sTip" hidden style="margin:0"><b>Tip técnico</b>${x.tip}</div>
  <div class="srow"><button class="pill" id="sTipB" aria-expanded="false">${BULB}Tip técnico</button><a class="pill" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent(x.yt)}">${ICON.yt}Videos en YouTube</a><button class="pill dark" id="closeSheet">Cerrar</button></div>`;
  mountViewer($("sView"),id,null);
  sh.querySelectorAll(".pers button").forEach(b=>b.onclick=()=>setPersona(b.dataset.p));
  $("sTipB").onclick=()=>{const t=$("sTip");t.hidden=!t.hidden;$("sTipB").setAttribute("aria-expanded",!t.hidden)};
  $("scrim").hidden=false;$("closeSheet").onclick=closeSheet;
}
function closeSheet(){$("scrim").hidden=true;untrack($("sheet"));$("sheet").innerHTML="";VW=null}
$("scrim").onclick=e=>{if(e.target.id==="scrim")closeSheet()};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("scrim").hidden)closeSheet()});

/* ---------- audio ---------- */
let AC=null,muted=false,keepAlive=null;
function silentWav(){const sr=8000,n=sr,buf=new ArrayBuffer(44+n),d=new DataView(buf);const w=(o,t)=>{for(let i=0;i<t.length;i++)d.setUint8(o+i,t.charCodeAt(i))};
  w(0,"RIFF");d.setUint32(4,36+n,true);w(8,"WAVEfmt ");d.setUint32(16,16,true);d.setUint16(20,1,true);d.setUint16(22,1,true);d.setUint32(24,sr,true);d.setUint32(28,sr,true);d.setUint16(32,1,true);d.setUint16(34,8,true);w(36,"data");d.setUint32(40,n,true);
  for(let i=0;i<n;i++)d.setUint8(44+i,128);let bin="";const u=new Uint8Array(buf);for(let i=0;i<u.length;i++)bin+=String.fromCharCode(u[i]);return "data:audio/wav;base64,"+btoa(bin)}
function unlockAudio(){
  // iPhone: play a silent looping track so beeps play even with the ring/silent switch on
  try{if(navigator.audioSession)navigator.audioSession.type="playback"}catch(e){}
  try{if(!keepAlive){keepAlive=new Audio(silentWav());keepAlive.loop=true;keepAlive.setAttribute("playsinline","")}keepAlive.play().catch(()=>{})}catch(e){}
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state!=="running")AC.resume();
    const b=AC.createBuffer(1,1,22050),src=AC.createBufferSource();src.buffer=b;src.connect(AC.destination);src.start(0)}catch(e){}
}
let master=null;
function tone(f,dur,vol,delay=0){
  if(muted||!AC)return;
  try{if(AC.state!=="running")AC.resume();
    if(!master){master=AC.createGain();master.gain.value=1;const lp=AC.createBiquadFilter();lp.type="lowpass";lp.frequency.value=2200;lp.Q.value=.3;master.connect(lp).connect(AC.destination)}
    const t=AC.currentTime+.03+delay,g=AC.createGain();
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.05);g.gain.exponentialRampToValueAtTime(.0001,t+dur);g.connect(master);
    for(const [m,amp] of [[1,1],[2,.16],[2.76,.06]]){const o=AC.createOscillator(),ga=AC.createGain();o.type="sine";o.frequency.value=f*m;ga.gain.value=amp;o.connect(ga).connect(g);o.start(t);o.stop(t+dur+.05)}
  }catch(e){}
}
/* soft bell-like sounds: sine partials, slow attack, long fade */
const SND={
  tick:()=>tone(659.25,.8,.035),
  start:()=>{tone(523.25,2.4,.065);tone(783.99,2.8,.055,.2)},
  end:()=>{tone(392,3.4,.075);tone(587.33,3.2,.035,.06)},
  soft:()=>tone(659.25,1.8,.04),
  done:()=>{tone(523.25,2.6,.055);tone(659.25,2.6,.045,.28);tone(783.99,3.2,.045,.56)}
};
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
let wake=null;async function lockWake(){try{wake=await navigator.wakeLock.request("screen")}catch(e){wake=null}}

/* ---------- player ---------- */
let P=null;
function buildSteps(){
  const ex=active(),st=[{type:"prep",dur:10,ex:S.warm?WARM[0]:ex[0]}];
  if(S.warm)WARM.forEach((id,i)=>st.push({type:"warm",dur:30,ex:id,i}));
  for(let r=0;r<S.rounds;r++)ex.forEach((id,i)=>{
    const uni=EX[id].uni,first=r===0&&i===0;
    if(first)st.push({type:"show",dur:PREVIEW,ex:id,r,i,side:uni?"izq":null});
    if(uni){st.push({type:"work",dur:S.work,ex:id,r,i,side:"izq"});st.push({type:"switch",dur:PREVIEW,ex:id,r,i,side:"der"});st.push({type:"work",dur:S.work,ex:id,r,i,side:"der"})}
    else st.push({type:"work",dur:S.work,ex:id,r,i});
    const nid=i<ex.length-1?ex[i+1]:ex[0],nside=EX[nid].uni?"izq":null;
    if(i<ex.length-1)st.push({type:"rest",dur:S.rest,ex:nid,side:nside,r,i});
    else if(r<S.rounds-1)st.push({type:"roundrest",dur:S.rrest,ex:nid,side:nside,r,i});
  });
  return {steps:st,ex};
}
function startWorkout(){
  try{unlockAudio()}catch(e){}
  try{lockWake()}catch(e){}
  const {steps,ex}=buildSteps();
  P={steps,ex,idx:0,running:true,remain:steps[0].dur,endAt:performance.now()+steps[0].dur*1000,lastSec:null,startedAt:Date.now()};
  const el=$("player");el.hidden=false;document.body.style.overflow="hidden";
  el.innerHTML=`<div class="pin">
    <div class="ptop"><button class="rb" id="pClose" aria-label="Salir">${ICON.x}</button><span class="mid" id="pRound"></span><button class="rb" id="pMute" aria-label="Sonido">${muted?ICON.mute:ICON.snd}</button></div>
    <div class="pticks" id="pTicks"></div>
    <div class="phrow"><div><span class="phase" id="pPhase"></span><h2 class="pname" id="pName"></h2></div><button class="tipb" id="pTipB" aria-label="Tip técnico" aria-expanded="false">${BULB}</button></div>
    <div class="ptip" id="pTip" hidden></div>
    <div class="stage"><div class="ring" id="pRing"><svg viewBox="0 0 100 100"><circle class="trk" cx="50" cy="50" r="47"/><circle class="prg" id="pPrg" cx="50" cy="50" r="47" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/></svg><div class="view viewer" id="pView"></div><span class="nextbadge">Próximo</span></div></div>
    <div class="clock num" id="pClock"></div>
    <div class="next" id="pNext"></div>
    <div class="ctrls"><button class="cbtn" id="pPrev" aria-label="Anterior">${ICON.prev}</button><button class="cbtn main" id="pPlay" aria-label="Pausa">${ICON.pause}</button><button class="cbtn" id="pNextB" aria-label="Siguiente">${ICON.next}</button></div>
  </div>`;
  $("pPlay").onclick=togglePause;
  $("pPrev").onclick=()=>goStep(Math.max(0,P.idx-(P.steps[P.idx].dur-P.remain>2?0:1)));
  $("pNextB").onclick=()=>goStep(P.idx+1);
  $("pMute").onclick=()=>{muted=!muted;$("pMute").innerHTML=muted?ICON.mute:ICON.snd};
  $("pTipB").onclick=()=>{const t=$("pTip");t.hidden=!t.hidden;$("pTipB").setAttribute("aria-expanded",!t.hidden)};
  let armed=0;$("pClose").onclick=()=>{const b=$("pClose");if(Date.now()-armed<2500){endWorkout()}else{armed=Date.now();b.textContent="¿Salir?";b.classList.add("warn");setTimeout(()=>{if($("pClose")){b.innerHTML=ICON.x;b.classList.remove("warn")}},2500)}};
  showStep();SND.soft();
}
function showStep(){
  const st=P.steps[P.idx],el=$("player"),x=EX[st.ex];el.dataset.phase=st.type;
  const labels={show:"Primer ejercicio",switch:"Cambio de lado",prep:"Preparate",warm:`Calor ${(st.i||0)+1}/${WARM.length}`,work:"Trabajo",rest:"Descanso",roundrest:"Pausa larga"};
  $("pPhase").textContent=labels[st.type];
  const isPrev=st.type==="rest"||st.type==="roundrest";
  const nm=st.type==="prep"?(S.warm?"Entrada en calor":x.name):x.name;
  $("pName").innerHTML=(isPrev?`<span class="upnext">Se viene</span>`:"")+nm+(st.side?`<span class="side">${sideTxt(x,st.side)}</span>`:"");
  $("pRing").classList.toggle("preview",isPrev||st.type==="show");
  $("pTip").innerHTML=`<b>Tip técnico</b>${x.tip}`;
  const pv=$("pView");untrack(pv);mountViewer(pv,st.ex,st.side||null);
  const rd=st.r==null?null:st.r+1+(st.type==="roundrest"?1:0);
  $("pRound").textContent=rd?`Vuelta ${Math.min(rd,S.rounds)} de ${S.rounds}`:"Antes de empezar";
  const tk=$("pTicks");tk.innerHTML="";
  P.ex.forEach((_,i)=>{const d=document.createElement("i");
    if(st.type==="work"||st.type==="show"||st.type==="switch"){if(i<st.i)d.className="done";else if(i===st.i)d.className="cur"}
    else if(st.type==="rest"&&i<=st.i)d.className="done";
    tk.appendChild(d)});
  let nx="";
  if(st.type==="warm"){const n=P.steps[P.idx+1];nx=`Sin pesa o liviana · Después: <b>${EX[n&&n.type==="warm"?n.ex:P.ex[0]].name}</b>`}
  else if(st.type==="show")nx=`Mirá el movimiento · ${x.hold}`;
  else if(st.type==="switch")nx=`Pasá la pesa a la otra mano`;
  else if(isPrev)nx=`Descansá y mirá cómo se hace · ${x.hold}`;
  else if(st.type==="work"){const n=P.steps.slice(P.idx+1).find(s=>s.type==="work");nx=n?`Después: <b>${EX[n.ex].name}${n.side?" · "+sideTxt(EX[n.ex],n.side):""}</b>`:"<b>Último ejercicio</b>"}
  else nx=x.mus;
  $("pNext").innerHTML=nx;tickDraw();
}
function goStep(i){
  if(i>=P.steps.length){finish();return}
  P.idx=i;P.remain=P.steps[i].dur;P.endAt=performance.now()+P.remain*1000;P.lastSec=null;
  if(!P.running){P.running=true;$("pPlay").innerHTML=ICON.pause}
  const pt=P.steps[i-1]&&P.steps[i-1].type;if(pt==="work")SND.end();else if(P.steps[i].type==="work"){SND.start();buzz(120)}else SND.soft();
  showStep();
}
function togglePause(){unlockAudio();P.running=!P.running;if(P.running)P.endAt=performance.now()+P.remain*1000;$("pPlay").innerHTML=P.running?ICON.pause:ICON.play;$("pPlay").setAttribute("aria-label",P.running?"Pausa":"Seguir")}
function tickDraw(){const st=P.steps[P.idx];$("pClock").textContent=fmt(P.remain);$("pPrg").setAttribute("stroke-dashoffset",(100*P.remain/st.dur).toFixed(2))}
function tick(now){
  if(!P||!P.running||P.finished)return;
  P.remain=(P.endAt-now)/1000;const sec=Math.ceil(P.remain);
  if(sec!==P.lastSec){if(sec<=3&&sec>0)SND.tick();P.lastSec=sec}
  if(P.remain<=0){goStep(P.idx+1);return}
  tickDraw();
}
function finish(){
  P.finished=true;const mins=Math.max(1,Math.round((Date.now()-P.startedAt)/60000));
  SND.done();try{keepAlive&&keepAlive.pause()}catch(e){}
  const el=$("player");untrack(el);el.dataset.phase="work";
  el.innerHTML=`<div class="pin"><div class="done"><span class="phase">Listo</span><h2>Rutina terminada</h2>
  <p>${FOCUS[S.focus].name} ${"ABC"[rIdx()]} · ${RT().name}<br><span class="num">${S.rounds}</span> ${S.rounds>1?"vueltas":"vuelta"} · <span class="num">${P.ex.length}</span> ejercicios · <span class="num">${mins}</span> min</p>
  <button class="dock-like" id="pBack">Volver</button></div></div>`;
  $("pBack").onclick=endWorkout;
}
function endWorkout(){VW=null;const el=$("player");untrack(el);el.hidden=true;el.innerHTML="";document.body.style.overflow="";P=null;try{wake&&wake.release()}catch(e){}wake=null;try{keepAlive&&keepAlive.pause()}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&P&&!P.finished){lockWake();try{AC&&AC.resume();keepAlive&&keepAlive.play().catch(()=>{})}catch(e){}}});
$("go").addEventListener("click",()=>{try{startWorkout()}catch(e){showErr(e)}});
function showErr(e){let t=$("errToast");if(!t){t=document.createElement("div");t.id="errToast";t.style.cssText="position:fixed;left:16px;right:16px;top:calc(16px + env(safe-area-inset-top,0px));z-index:99;background:#111;color:#fff;padding:12px 14px;border-radius:14px;font-size:13px;line-height:1.4";document.body.appendChild(t)}
  t.textContent="Error: "+(e&&(e.message||e))+(e&&e.stack?" · "+String(e.stack).split("\n")[1]:"");t.onclick=()=>t.remove()}
window.addEventListener("error",ev=>showErr(ev.error||ev.message));
window.addEventListener("unhandledrejection",ev=>{const r=ev.reason;if(r&&/play|wake|NotAllowed|audio/i.test(String(r&&(r.name||r.message||r))))return;showErr(r)});

/* ---------- loop ---------- */
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function frame(now){const t=now/1000;if(!reduce)figs.forEach(s=>{if(!s.isConnected){figs.delete(s);return}drawFig(s,t)});viewerFrame(now);spriteFrame(now);tick(now);requestAnimationFrame(frame)}
if(HAS3D){try{init3D();genThumbs()}catch(e){console.error(e)}}
renderAll();requestAnimationFrame(frame);
</script>
